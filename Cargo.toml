[package]
name = "miner"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-canon = "0.1"
rand = "0.8"
clap = { version = "4", features = ["derive"]}
wgpu = "28.0.0"
bytemuck = "1.25.0"
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
blake2 = "0.10"
digest = "0.10"
